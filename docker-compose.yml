services:
  mysql:
    image: mysql:8.0
    container_name: gate-pass-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Anshu123
      MYSQL_DATABASE: gate_pass
      MYSQL_USER: gate_pass_user
      MYSQL_PASSWORD: Anshu123
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./Backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
